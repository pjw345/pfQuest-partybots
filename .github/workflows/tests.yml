name: Client tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/test_client.py -v
      - run: python scripts/package.py
